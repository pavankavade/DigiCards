name = "digicards"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Cloudflare D1 Database binding
# Run 'npx wrangler d1 create digicards-db' to generate your database_id
[[d1_databases]]
binding = "DB"
database_name = "digicards-db"
database_id = "PLACEHOLDER_D1_DATABASE_ID"

# Cloudflare R2 Bucket binding for image uploads
# Run 'npx wrangler r2 bucket create digicards-uploads' to create the bucket
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "digicards-uploads"
